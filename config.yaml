modbus:
- name: modbus1
  enabled: true
  host: 0.0.0.0
  port: 1502
  update_interval_ms: 500
  word_order: big
  tags:
  - name: HR_Float
    count: 10000
    data_type: float32
    generator: random
    min: 0
    max: 100
    area: holding_registers
  - name: IR_Int
    count: 5000
    data_type: int16
    generator: sine
    min: -1000
    max: 1000
    period_s: 60
    area: input_registers
  - name: Coil
    count: 1000
    generator: square
    period_s: 10
    area: coils
opcua:
- name: opcua1
  enabled: true
  host: 0.0.0.0
  port: 4840
  update_interval_ms: 500
  namespace: urn:botond:simulator
  writable: false
  folder_size: 1000
  tags:
  - name: Random
    count: 40000
    data_type: float64
    generator: random
    min: 0
    max: 100
opcda:
- name: opcda1
  enabled: true
  prog_id: BIDPS.OpcDaSimulator.1
  update_interval_ms: 1000
  tags:
  - name: Random
    count: 1000
    data_type: float64
    generator: random
    min: 0
    max: 100
  - name: Ramp
    count: 100
    data_type: float32
    generator: ramp
    min: 0
    max: 100
    period_s: 60
  - name: Running
    count: 50
    data_type: bool
    generator: square
    period_s: 30
mqtt_broker:
- name: broker1
  enabled: true
  host: 0.0.0.0
  port: 1883
mqtt:
- name: mqtt1
  enabled: true
  broker_host: 127.0.0.1
  broker_port: 1883
  update_interval_ms: 1000
  topic_prefix: sim/mqtt1
  mode: per_tag
  batch_size: 1000
  payload_format: json
  qos: 0
  retain: false
  tags:
  - name: Temp
    count: 1000
    data_type: float32
    generator: random_walk
    min: 20
    max: 80
    step: 0.5
  - name: Status
    count: 100
    data_type: bool
    generator: square
    period_s: 30
bacnet:
- name: bacnet1
  enabled: true
  ip_address: auto
  port: 47808
  device_instance: 1001
  update_interval_ms: 1000
  tags:
  - name: AI
    count: 50
    object_type: analog-input
    generator: sine
    min: 0
    max: 100
    period_s: 120
  - name: BV
    count: 20
    object_type: binary-value
    generator: square
    period_s: 60
- name: bacnet2
  enabled: true
  ip_address: auto
  port: 47809
  device_instance: 1002
  update_interval_ms: 1000
  tags:
  - name: AI
    count: 50
    object_type: analog-input
    generator: sine
    min: 0
    max: 100
    period_s: 120
